[project]
name = "order-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "freezegun>=1.5",
    "polyfactory>=2.16",
    "respx>=0.21",
    "aioresponses>=0.7.6",
    "requests-mock>=1.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
