# python-architecture layout. Package root is `project/` — substitute if the repo differs.
# Copy to the repository root. Each module must match exactly one layer.

exclude_modules = ["*.__init__"]

[layers]

[layers.libs]
description = "Shared types, exceptions, schemas, settings, logger, reusable libs"
contains_modules = [
    "project.datatypes",
    "project.logger",
    "project.settings",
    "project.libs",
    "project.libs.*",
    "*.exceptions",
    "*.interfaces",
    "*.schemas",
    "*.enums",
]
depends_on = ["libs"]

[layers.adapters]
description = "Facades over external systems (HTTP, DB, cache, queues) and the HTTP client helper"
contains_modules = [
    "project.infrastructure.adapters",
    "project.infrastructure.adapters.*",
    "project.infrastructure.base.http_client",
    "project.infrastructure.base.http_client.*",
]
depends_on = ["libs", "adapters"]

[layers.repositories]
description = "Data access and ORM — only these modules talk to SQLAlchemy or Redis"
contains_modules = [
    "project.components.*.models",
    "project.components.*.models.*",
    "project.components.*.repositories",
    "project.components.*.repositories.*",
    "project.base.models",
    "project.base.models.*",
    "project.base.repositories",
    "project.base.repositories.*",
]
depends_on = ["adapters", "domain", "libs", "repositories"]

[layers.domain]
description = "Rich domain Entities and pure domain functions; no I/O, Container, or frameworks"
contains_modules = [
    "project.components.*.entities",
    "project.components.*.entities.*",
]
exclude_modules = ["*.exceptions", "*.interfaces", "*.schemas", "*.enums"]
depends_on = ["libs", "domain"]

[layers.usecases]
description = "I/O orchestration and AI agents; no SQLAlchemy, AsyncSession, or Redis client"
contains_modules = [
    "project.components.*.use_cases",
    "project.components.*.use_cases.*",
    "project.components.*.validation",
    "project.components.*.ai",
    "project.components.*.ai.*",
]
exclude_modules = ["*.exceptions", "*.interfaces", "*.schemas", "*.enums"]
depends_on = ["dicontainer", "domain", "libs", "usecases"]

[layers.dicontainer]
description = "LazyInit composition root (LazyService paths are strings, not imports)"
contains_modules = ["project.container"]
depends_on = ["libs"]

[layers.admin]
description = "Admin panel over ORM models (sqladmin); empty unless an admin panel is installed"
contains_modules = [
    "project.infrastructure.apps.admin",
    "project.infrastructure.apps.admin.*",
]
depends_on = ["libs", "adapters", "repositories"]

[layers.presentation]
description = "HTTP, CLI, and bot I/O: endpoints, handlers, app factory, framework helpers"
contains_modules = [
    "project.infrastructure.apps",
    "project.infrastructure.apps.*",
    "project.infrastructure.base.telegram",
    "project.infrastructure.base.telegram.*",
    "project.components.*.endpoints",
    "project.components.*.endpoints.*",
    "project.components.*.handlers",
    "project.components.*.handlers.*",
    "project.base.handlers",
    "project.base.handlers.*",
    "project.components.*.cli",
    "project.components.*.cli.*",
]
depends_on = ["dicontainer", "usecases", "libs", "presentation", "admin"]

[libs]

[libs.sqlalchemy]
allowed_in = ["adapters", "repositories"]

[libs.fastapi]
allowed_in = ["presentation"]

[libs.telegram]
allowed_in = ["presentation"]

[libs.starlette]
allowed_in = ["presentation"]

[libs.sse_starlette]
allowed_in = ["presentation"]

[libs.redis]
allowed_in = ["adapters", "repositories"]

[libs.sqladmin]
allowed_in = ["admin"]

[libs.fastapi_limiter]
allowed_in = ["presentation", "adapters"]

[libs.jwt]
allowed_in = ["libs"]

[libs.pwdlib]
allowed_in = ["libs"]

[libs.httpx]
allowed_in = ["adapters"]

[libs.requests]
allowed_in = []  # use httpx

[libs.pandas]
allowed_in = []

[libs.polars]
allowed_in = []

[libs.alembic]
allowed_in = []  # migrations live outside project/

[libs.pytest]
allowed_in = []  # tests live outside project/

[libs.unittest]
allowed_in = []
